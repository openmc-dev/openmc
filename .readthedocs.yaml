version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      - git fetch --unshallow || true
      - cd docs/doxygen && doxygen && cd -

sphinx:
  configuration: docs/source/conf.py

formats:
  - pdf

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
