[build-system]
requires = ["scikit-build-core>=0.10", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "openmc"
authors = [
    {name = "The OpenMC Development Team", email = "openmc@anl.gov"},
]
description = "OpenMC"
dynamic = ["version"]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy",
    "h5py",
    "scipy",
    "ipython",
    "matplotlib",
    "pandas",
    "lxml",
    "uncertainties",
    "endf",
]

[project.optional-dependencies]
depletion-mpi = ["mpi4py"]
docs = [
    "breathe",
    "sphinx",
    "sphinxcontrib-katex",
    "sphinx-numfig",
    "jupyter",
    "sphinxcontrib-svg2pdfconverter",
    "sphinx-rtd-theme"
]
test = [
    "packaging",
    "pytest",
    "pytest-cov>=4.0",
    "pytest-rerunfailures",
    "colorama",
    "openpyxl",
]
ci = ["coverage>=7.4", "gcovr>=7.2"]
vtk = ["vtk"]

[project.urls]
Homepage = "https://openmc.org"
Documentation = "https://docs.openmc.org"
Repository = "https://github.com/openmc-dev/openmc"
Issues = "https://github.com/openmc-dev/openmc/issues"

# Scikit-Build Configuration
[tool.scikit-build]
build-dir="build"
wheel.install-dir = "openmc"
wheel.packages = ["openmc"]
sdist.include = ["*.h5"]

# project.version is dynamic, so scikit-build-core needs to be told where the
# version comes from. Without this it refuses to generate metadata at all,
# before any compilation, with "project.version is not specified, must be
# statically present or tool.scikit-build metadata.version.provider configured
# when dynamic". setuptools-scm reads its own configuration from
# [tool.setuptools_scm] below.
#
# This is the top-level spelling; the older tool.scikit-build.metadata.version
# form still works but scikit-build-core 1.x warns that it is deprecated.
# [[tool.dynamic-metadata]] needs scikit-build-core 0.10 or newer, hence the
# pin in [build-system] requires.
[[tool.dynamic-metadata]]
field = "version"
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
